<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ориентир — карта, новости, подбор</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
</head>
<body>

  <header class="topbar">
    <h1 class="logo fx-btn">🧭 Ориентир</h1>
    <nav class="tabs">
      <button class="tab fx-btn active" data-tab="map">🗺️ Карта</button>
      <button class="tab fx-btn" data-tab="news">📰 Новости</button>
      <button class="tab fx-btn" data-tab="history">📜 История кино</button>
      <button class="tab fx-btn" data-tab="quiz">🎬 Подбор</button>
    </nav>
  </header>

  <main>
    <!-- КАРТА -->
    <section id="map" class="section active">
  <h2>Карта мест из фильмов и книг</h2>
  <div id="map-container"></div>
</section>
      </div>
      <div id="pin-info" class="info-box">
        Нажми на точку, чтобы узнать подробнее 👆
      </div>
    </section>

    <!-- НОВОСТИ -->
    <section id="news" class="section">
      <h2>Новости кино и книг</h2>
      <div id="news-list" class="news-grid"></div>
    </section>

    <!-- ИСТОРИЯ КИНО -->
<section id="history" class="section">
  <h2>История кино — кратко</h2>
  <div id="timeline" class="timeline"></div>
</section>

    <!-- ОПРОС -->
    <section id="quiz" class="section">
      <h2>Подбор по настроению</h2>

      <div class="question">
        <p>1. Как ты себя чувствуешь?</p>
        <button class="option fx-btn" data-q="energy" data-v="tired">😴 Устал(а)</button>
        <button class="option fx-btn" data-q="energy" data-v="normal">🙂 Нормально</button>
        <button class="option fx-btn" data-q="energy" data-v="energetic">⚡ Полон(а) сил</button>
      </div>

      <div class="question">
        <p>2. Какое настроение?</p>
        <button class="option fx-btn" data-q="mood" data-v="sad">😢 Грустное</button>
        <button class="option fx-btn" data-q="mood" data-v="happy">😄 Весёлое</button>
        <button class="option fx-btn" data-q="mood" data-v="anxious">😰 Тревожное</button>
        <button class="option fx-btn" data-q="mood" data-v="calm">🌿 Спокойное</button>
      </div>

      <div class="question">
        <p>3. Чего хочешь?</p>
        <button class="option fx-btn" data-q="goal" data-v="distract">🎈 Отвлечься</button>
        <button class="option fx-btn" data-q="goal" data-v="think">🤔 Подумать</button>
        <button class="option fx-btn" data-q="goal" data-v="adventure">🚀 Приключений</button>
      </div>

      <div class="question">
        <p>4. Сколько сил?</p>
        <button class="option fx-btn" data-q="length" data-v="short">⏱ До 1.5 часа</button>
        <button class="option fx-btn" data-q="length" data-v="long">🕰 Готов(а) на долгое</button>
      </div>

      <button id="submit" class="fx-btn primary" disabled>Подобрать 🎲</button>

      <div id="result" class="hidden">
        <h3>Тебе подойдёт:</h3>
        <div id="cards"></div>
        <button id="restart" class="fx-btn primary">Пройти заново 🔄</button>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
